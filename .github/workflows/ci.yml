name: macOS regression checks
on:
  push:
    branches: [meta, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift core and integration suite (no live API)
        run: env -u EW_LIVE_EXTRACTION_PDF -u EW_LIVE_KEY_FILE -u EW_LIVE_REPORT bash script/test.sh
      - name: Package and benchmark regression tests
        run: python3 -m unittest discover -s script/tests -v
      - name: Isolated review bundle
        run: bash script/build_review.sh --build-only
